# Builds the plugin and publishes a GitHub release when a version tag is pushed.
#
#   git tag 2026.10.10
#   git push origin 2026.10.10
#
# The release contains Emby.GitHubRepoPluginInstall.dll, which is what the installer plugin downloads when it
# updates itself and what it uses to update every other plugin that follows this repository.
#
# Tags look like the existing ones: 2026.08.27, or 2026.08.27.1 for a second release the same day. A leading "v" is allowed.
# Release notes come from the tag's message if it is an annotated tag (git tag -a 2026.10.10 -m "..."),
# otherwise GitHub writes them from the commits since the previous release.

name: Release

on:
  push:
    tags:
      - '[0-9]*'
      - 'v[0-9]*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Work out the version from the tag
        id: version
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          # .NET versions are up to four numbers separated by dots
          if ! [[ "$version" =~ ^[0-9]+(\.[0-9]+){1,3}$ ]]; then
            echo "::error::The tag '$tag' is not a version like 2026.10.10 or 2026.10.10.1"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building version $version"

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          # global.json asks for 8.0.0 and lets it roll forward, so any 8.0.x SDK satisfies it
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: >
          dotnet build Emby.GitHubRepoPluginInstall.sln
          --configuration Release
          --no-restore
          -p:Version=${{ steps.version.outputs.version }}
          -p:AssemblyVersion=${{ steps.version.outputs.version }}
          -p:FileVersion=${{ steps.version.outputs.version }}
          -p:InformationalVersion=${{ steps.version.outputs.version }}

      # A release is only published if the tests pass
      - name: Test
        run: dotnet test Emby.GitHubRepoPluginInstall.Tests --configuration Release --no-build --logger "console;verbosity=normal"

      - name: Collect the plugin DLL
        run: |
          mkdir -p dist
          cp Emby.GitHubRepoPluginInstall/bin/Release/net8.0/Emby.GitHubRepoPluginInstall.dll dist/
          ls -l dist

      - name: Write the release notes
        run: |
          tag="${GITHUB_REF_NAME}"
          notes=""
          # An annotated tag carries its own message. A lightweight tag has none.
          if [ "$(git cat-file -t "refs/tags/$tag")" = "tag" ]; then
            notes="$(git tag -l --format='%(contents)' "$tag")"
          fi
          printf '%s' "$notes" > release-notes.md
          if [ -s release-notes.md ]; then echo "Using the tag message as the release notes"; else echo "No tag message; GitHub will generate the notes"; fi

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "::error::A release for $tag already exists. Delete it or use a new tag."
            exit 1
          fi

          if [ -s release-notes.md ]; then
            gh release create "$tag" dist/Emby.GitHubRepoPluginInstall.dll \
              --title "$tag" --notes-file release-notes.md --verify-tag
          else
            gh release create "$tag" dist/Emby.GitHubRepoPluginInstall.dll \
              --title "$tag" --generate-notes --verify-tag
          fi
